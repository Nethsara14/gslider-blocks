name: Issue Automation & Labeler

on:
  issues:
    types: [opened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

jobs:
  auto-label-issue:
    name: Auto-Label Issue
    runs-on: ubuntu-latest
    steps:
      - name: Apply Intelligent Issue Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const author = issue.user.login;
            const action = context.payload.action;
            const title = issue.title;
            const labelsToAdd = new Set();

            // 0. Auto-assign issue author (or repo maintainer) on open
            if (action === 'opened' && (!issue.assignees || issue.assignees.length === 0)) {
              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: [author]
                });
                console.log(`Auto-assigned author @${author} to issue #${issue.number}`);
              } catch (err) {
                // If external contributor cannot be assigned directly, fallback to maintainer
                try {
                  await github.rest.issues.addAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    assignees: ['noruzzamans']
                  });
                  console.log(`Assigned maintainer @noruzzamans to issue #${issue.number}`);
                } catch (fallbackErr) {
                  console.log(`Failed to assign fallback maintainer: ${fallbackErr.message}`);
                }
              }
            }

            // 1. Conventional Commits & Common Issue Prefixes parser
            if (/^(fix|bug)(\(.*\))?:/i.test(title)) labelsToAdd.add('type: bug');
            if (/^feat(\(.*\))?:/i.test(title)) labelsToAdd.add('type: enhancement');
            if (/^refactor(\(.*\))?:/i.test(title)) labelsToAdd.add('type: architecture');
            if (/^perf(\(.*\))?:/i.test(title)) labelsToAdd.add('type: performance');
            if (/^sec(urity)?(\(.*\))?:/i.test(title)) labelsToAdd.add('type: security');
            if (/^docs(\(.*\))?:/i.test(title)) labelsToAdd.add('type: documentation');
            if (/^(ci|chore|test)(\(.*\))?:/i.test(title)) labelsToAdd.add('focus: ci-cd');

            // Explicit component / tool prefix parser (e.g. `Storybook: ...`, `[Storybook] ...`)
            if (/^\[?storybook\]?:?/i.test(title)) {
              labelsToAdd.add('focus: design-system');
              labelsToAdd.add('focus: ci-cd');
            }

            // 2. Scope parser (e.g. feat(mcp): ..., refactor(design-system): ..., [mcp]: ...)
            const scopeMatch = title.match(/^[a-z]+(?:\(([^)]+)\))?:/i) || title.match(/^\[([^\]]+)\]/i);
            if (scopeMatch && scopeMatch[1]) {
              const scope = scopeMatch[1].toLowerCase().trim();
              if (scope.includes('design') || scope.includes('admin') || scope.includes('ui') || scope.includes('control') || scope.includes('storybook')) {
                labelsToAdd.add('focus: design-system');
              }
              if (scope.includes('storybook')) {
                labelsToAdd.add('focus: ci-cd');
              }
              if (scope.includes('block') || scope.includes('slider') || scope.includes('carousel')) {
                labelsToAdd.add('focus: blocks');
              }
              if (scope.includes('mcp')) {
                labelsToAdd.add('focus: mcp');
              }
              if (scope.includes('headless') || scope.includes('rest') || scope.includes('api')) {
                labelsToAdd.add('focus: headless');
              }
              if (scope.includes('swiper') || scope.includes('carousel') || scope.includes('slider')) {
                labelsToAdd.add('focus: swiper-engine');
              }
              if (scope.includes('core') || scope.includes('php') || scope.includes('backend')) {
                labelsToAdd.add('focus: php-backend');
              }
              if (scope.includes('ci') || scope.includes('deps') || scope.includes('build') || scope.includes('release') || scope.includes('workflow')) {
                labelsToAdd.add('focus: ci-cd');
              }
              if (scope.includes('a11y') || scope.includes('accessibility')) {
                labelsToAdd.add('focus: accessibility');
              }
              if (scope.includes('i18n') || scope.includes('translat')) {
                labelsToAdd.add('focus: i18n');
              }
            }

            // 3. Fallback keywords parser (checks title & issue body)
            const lowerTitle = title.toLowerCase();
            const lowerBody = (issue.body || '').toLowerCase();

            if (!labelsToAdd.has('focus: mcp') && (lowerTitle.includes('mcp') || lowerBody.includes('mcp server'))) {
              labelsToAdd.add('focus: mcp');
            }
            if (!labelsToAdd.has('focus: swiper-engine') && (lowerTitle.includes('swiper') || lowerTitle.includes('carousel'))) {
              labelsToAdd.add('focus: swiper-engine');
            }
            if (!labelsToAdd.has('focus: headless') && (lowerTitle.includes('rest api') || lowerTitle.includes('headless') || lowerTitle.includes('wpgraphql'))) {
              labelsToAdd.add('focus: headless');
            }
            if (!labelsToAdd.has('focus: design-system') && (lowerTitle.includes('admin') || lowerTitle.includes('dashboard') || lowerTitle.includes('controls') || lowerTitle.includes('storybook') || lowerTitle.includes('component') || lowerTitle.includes('inspector'))) {
              labelsToAdd.add('focus: design-system');
            }
            if (!labelsToAdd.has('focus: ci-cd') && (lowerTitle.includes('storybook') || lowerTitle.includes('github action') || lowerTitle.includes('workflow') || lowerTitle.includes('ci'))) {
              labelsToAdd.add('focus: ci-cd');
            }
            if (!labelsToAdd.has('focus: blocks') && (lowerTitle.includes('block') || lowerTitle.includes('slider') || lowerTitle.includes('testimonial') || lowerTitle.includes('flexi'))) {
              labelsToAdd.add('focus: blocks');
            }
            if (!labelsToAdd.has('focus: accessibility') && (lowerTitle.includes('a11y') || lowerTitle.includes('aria') || lowerTitle.includes('wcag') || lowerTitle.includes('screen reader'))) {
              labelsToAdd.add('focus: accessibility');
            }

            // 4. Fallback type inference if no type label was matched
            const hasTypeLabel = Array.from(labelsToAdd).some(l => l.startsWith('type:'));
            if (!hasTypeLabel) {
              if (/\b(bug|error|crash|broken|empty|fail|fails|failed|issue|wrong|cannot|not working|raw text|inconsistent|mocks?)\b/i.test(lowerTitle)) {
                labelsToAdd.add('type: bug');
              } else if (/\b(add|feat|feature|enhancement|support|match|align|improve|update|request)\b/i.test(lowerTitle)) {
                labelsToAdd.add('type: enhancement');
              } else if (/\b(doc|docs|documentation|readme|guide)\b/i.test(lowerTitle)) {
                labelsToAdd.add('type: documentation');
              }
            }

            // Apply labels
            const currentLabels = (issue.labels || []).map(l => l.name);
            const finalAdditions = Array.from(labelsToAdd).filter(l => !currentLabels.includes(l));

            if (finalAdditions.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: finalAdditions
              });
              console.log(`Successfully added labels to issue #${issue.number}: ${finalAdditions.join(', ')}`);
            }
