name: Issue Automation & Labeler

on:
  issues:
    types: [opened, edited, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}-${{ github.event.label.name || github.event.action }}
  cancel-in-progress: true

permissions:
  issues: write
  contents: read

jobs:
  auto-label-issue:
    name: Auto-Label Issue
    runs-on: ubuntu-latest
    steps:
      - name: Apply Intelligent Issue Labels
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const author = issue.user.login;
            const action = context.payload.action;
            const title = issue.title;
            const labelsToAdd = new Set();
            const OPEN_FOR_CONTRIBUTORS = ['help wanted', 'good first issue'];
            const issueLabels = (issue.labels || []).map(l => l.name);

            // 0. Auto-assign issue author (or repo maintainer) on open, skipping contributor-open issues
            if (
              action === 'opened' &&
              (!issue.assignees || issue.assignees.length === 0) &&
              !issueLabels.some(l => OPEN_FOR_CONTRIBUTORS.includes(l))
            ) {
              // Short delay before re-fetching to catch labels applied right after issue creation
              await new Promise(resolve => setTimeout(resolve, 3000));

              let freshLabels = issueLabels;
              let freshAssignees = issue.assignees || [];
              try {
                const { data: freshIssue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number
                });
                freshLabels = (freshIssue.labels || []).map(l => l.name);
                freshAssignees = freshIssue.assignees || [];
              } catch (fetchErr) {
                console.log(`Failed to re-fetch issue #${issue.number}: ${fetchErr.message}`);
              }

              if (
                freshAssignees.length === 0 &&
                !freshLabels.some(l => OPEN_FOR_CONTRIBUTORS.includes(l))
              ) {
                try {
                  await github.rest.issues.addAssignees({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    assignees: [author]
                  });
                  console.log(`Auto-assigned author @${author} to issue #${issue.number}`);
                } catch (err) {
                  // If external contributor cannot be assigned directly, fallback to maintainer
                  try {
                    await github.rest.issues.addAssignees({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      assignees: ['noruzzamans']
                    });
                    console.log(`Assigned maintainer @noruzzamans to issue #${issue.number}`);
                  } catch (fallbackErr) {
                    console.log(`Failed to assign fallback maintainer: ${fallbackErr.message}`);
                  }
                }
              } else {
                console.log(`Skipped auto-assign for issue #${issue.number} due to contributor label or existing assignee.`);
              }
            }

            // 0b. Remove automation-set assignee when a contributor label is added
            if (action === 'labeled') {
              const addedLabel = context.payload.label ? context.payload.label.name : '';
              if (OPEN_FOR_CONTRIBUTORS.includes(addedLabel)) {
                try {
                  const { data: freshIssue } = await github.rest.issues.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number
                  });
                  const assigneesToRemove = (freshIssue.assignees || [])
                    .map(a => a.login)
                    .filter(login => login === author || login === 'noruzzamans');

                  if (assigneesToRemove.length > 0) {
                    await github.rest.issues.removeAssignees({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issue.number,
                      assignees: assigneesToRemove
                    });
                    console.log(`Removed automation assignee(s) (${assigneesToRemove.join(', ')}) from issue #${issue.number}`);
                  }
                } catch (removeErr) {
                  console.log(`Failed to remove assignee from issue #${issue.number}: ${removeErr.message}`);
                }
              }
              return;
            }

            // 1. Conventional Commits prefix parser
            if (/^fix(\(.*\))?:/i.test(title)) labelsToAdd.add('type: bug');
            if (/^feat(\(.*\))?:/i.test(title)) labelsToAdd.add('type: enhancement');
            if (/^refactor(\(.*\))?:/i.test(title)) labelsToAdd.add('type: architecture');
            if (/^perf(\(.*\))?:/i.test(title)) labelsToAdd.add('type: performance');
            if (/^sec(urity)?(\(.*\))?:/i.test(title)) labelsToAdd.add('type: security');
            if (/^docs(\(.*\))?:/i.test(title)) labelsToAdd.add('type: documentation');
            if (/^(ci|chore|test)(\(.*\))?:/i.test(title)) labelsToAdd.add('focus: ci-cd');

            // 2. Scope parser (e.g. feat(mcp): ..., refactor(design-system): ...)
            const scopeMatch = title.match(/^[a-z]+(?:\(([^)]+)\))?:/i);
            if (scopeMatch && scopeMatch[1]) {
              const scope = scopeMatch[1].toLowerCase().trim();
              if (scope.includes('design') || scope.includes('admin') || scope.includes('ui') || scope.includes('control')) {
                labelsToAdd.add('focus: design-system');
              }
              if (scope.includes('block')) {
                labelsToAdd.add('focus: blocks');
              }
              if (scope.includes('mcp')) {
                labelsToAdd.add('focus: mcp');
              }
              if (scope.includes('headless') || scope.includes('rest') || scope.includes('api')) {
                labelsToAdd.add('focus: headless');
              }
              if (scope.includes('swiper') || scope.includes('carousel') || scope.includes('slider')) {
                labelsToAdd.add('focus: swiper-engine');
              }
              if (scope.includes('core') || scope.includes('php') || scope.includes('backend')) {
                labelsToAdd.add('focus: php-backend');
              }
              if (scope.includes('ci') || scope.includes('deps') || scope.includes('build') || scope.includes('release')) {
                labelsToAdd.add('focus: ci-cd');
              }
              if (scope.includes('a11y') || scope.includes('accessibility')) {
                labelsToAdd.add('focus: accessibility');
              }
              if (scope.includes('i18n') || scope.includes('translat')) {
                labelsToAdd.add('focus: i18n');
              }
            }

            // 3. Fallback title keywords if no conventional commit scope was matched
            const lowerTitle = title.toLowerCase();
            if (!labelsToAdd.has('focus: mcp') && lowerTitle.includes('mcp')) {
              labelsToAdd.add('focus: mcp');
            }
            if (!labelsToAdd.has('focus: swiper-engine') && (lowerTitle.includes('swiper') || lowerTitle.includes('carousel'))) {
              labelsToAdd.add('focus: swiper-engine');
            }
            if (!labelsToAdd.has('focus: headless') && (lowerTitle.includes('rest api') || lowerTitle.includes('headless'))) {
              labelsToAdd.add('focus: headless');
            }
            if (!labelsToAdd.has('focus: design-system') && (lowerTitle.includes('admin') || lowerTitle.includes('dashboard') || lowerTitle.includes('controls'))) {
              labelsToAdd.add('focus: design-system');
            }

            // Apply labels
            const currentLabels = (issue.labels || []).map(l => l.name);
            const finalAdditions = Array.from(labelsToAdd).filter(l => !currentLabels.includes(l));

            if (finalAdditions.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: finalAdditions
              });
              console.log(`Successfully added labels to issue #${issue.number}: ${finalAdditions.join(', ')}`);
            }
