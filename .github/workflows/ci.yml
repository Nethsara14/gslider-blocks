name: CI & Quality Assurance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  block-build-and-mcp:
    name: Block Build & MCP Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Plugin Dependencies
        run: npm ci

      - name: Verify Webpack Block Build
        run: npm run build

      # --ignore-scripts keeps `prepare` (the build) from regenerating the
      # committed schemas before the drift test compares them.
      - name: Install MCP Server Dependencies
        run: npm --prefix packages/mcp-server ci --ignore-scripts

      - name: Run MCP Schema Drift Test
        run: npm --prefix packages/mcp-server test

      - name: Build MCP Server
        run: npm --prefix packages/mcp-server run build

      - name: Run MCP Block Generation Test
        run: npm --prefix packages/mcp-server run test:generate

      - name: Verify Committed MCP Schemas Match a Fresh Extract
        run: |
          if ! git diff --exit-code -- packages/mcp-server/src/core/schemas packages/mcp-server/dist/core/schemas packages/mcp-server/dist/blocks; then
            echo "::error::Committed MCP schemas or block bundles are out of date. Run \"npm run mcp:build\" and commit packages/mcp-server/src/core/schemas, dist/core/schemas, and dist/blocks."
            exit 1
          fi

      - name: Verify Distribution Zip Archive
        run: npm run zip

  code-quality:
    name: Code Quality Advisory (JS & CSS Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Plugin Dependencies
        run: npm ci

      - name: Cache Linter Results
        uses: actions/cache@v4
        with:
          path: |
            .eslintcache
            .stylelintcache
          key: linter-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            linter-${{ runner.os }}-

      - name: JavaScript Standards Advisory
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Checking only modified JavaScript files in PR..."
            JS_FILES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" | grep -E '\.(js|jsx)$' | grep -v -E '^(build|vendor|assets|node_modules|packages|storybook-static)/' || true)
            if [ -n "$JS_FILES" ]; then
              echo "Linting changed JS files:"
              echo "$JS_FILES"
              npm run lint:js -- $JS_FILES || true
            else
              echo "No JavaScript files changed in this PR. Skipping."
            fi
          else
            echo "Running full repository JavaScript linting (Push to main)..."
            npm run lint:js -- --cache || true
          fi

      - name: SCSS Standards Advisory
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "Checking only modified SCSS/CSS files in PR..."
            CSS_FILES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" | grep -E '\.(css|scss)$' | grep -v -E '^(build|vendor|assets|node_modules|packages|storybook-static)/' || true)
            if [ -n "$CSS_FILES" ]; then
              echo "Linting changed SCSS/CSS files:"
              echo "$CSS_FILES"
              npm run lint:css -- $CSS_FILES || true
            else
              echo "No SCSS/CSS files changed in this PR. Skipping."
            fi
          else
            echo "Running full repository SCSS linting (Push to main)..."
            npm run lint:css -- --cache || true
          fi

  php-compatibility:
    name: PHP Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, json, libxml, mbstring
          coverage: none

      - name: Run Test Suites
        run: |
          for test in $(find tests -name '*.php' ! -name 'bootstrap.php' ! -path '*/stubs/*' | sort); do
            echo "Running $test on PHP ${{ matrix.php-version }}..."
            php "$test" || exit 1
          done
