name: CI & Quality Assurance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  block-build-and-mcp:
    name: Block Build & MCP Drift Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Plugin Dependencies
        run: npm ci

      - name: Verify Webpack Block Build
        run: npm run build

      - name: Code Quality Advisory (JS & CSS Lint)
        continue-on-error: true
        run: |
          echo "Checking JavaScript syntax and standards (Advisory)..."
          npm run lint:js || true
          echo "Checking SCSS syntax and standards (Advisory)..."
          npm run lint:css || true

      # --ignore-scripts keeps `prepare` (the build) from regenerating the
      # committed schemas before the drift test compares them.
      - name: Install MCP Server Dependencies
        run: npm --prefix packages/mcp-server ci --ignore-scripts

      - name: Run MCP Schema Drift Test
        run: npm --prefix packages/mcp-server test

      - name: Build MCP Server
        run: npm --prefix packages/mcp-server run build

      - name: Run MCP Block Generation Test
        run: npm --prefix packages/mcp-server run test:generate

      - name: Verify Committed MCP Schemas Match a Fresh Extract
        run: |
          if ! git diff --exit-code -- packages/mcp-server/src/core/schemas packages/mcp-server/dist/core/schemas packages/mcp-server/dist/blocks; then
            echo "::error::Committed MCP schemas or block bundles are out of date. Run \"npm run mcp:build\" and commit packages/mcp-server/src/core/schemas, dist/core/schemas, and dist/blocks."
            exit 1
          fi

      - name: Verify Distribution Zip Archive
        run: npm run zip

  php-compatibility:
    name: PHP Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, json, libxml, mbstring
          coverage: none

      - name: Run Test Suites
        run: |
          for test in tests/*.php; do
            echo "Running $test on PHP ${{ matrix.php-version }}..."
            php "$test"
          done
