<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 40" width="240" height="40" fill="none">
  <defs>
    <clipPath id="gslider-icon-clip">
      <rect x="2" y="2" width="36" height="36" rx="8" />
    </clipPath>
  </defs>

  <!-- Official GSlider Blocks Icon -->
  <g clip-path="url(#gslider-icon-clip)">
    <image href="data:image/png;base64," x="2" y="2" width="36" height="36" />
  </g>
  
  <!-- GSlider Brand Text -->
  <text x="48" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e1e1e" letter-spacing="-0.3">GSlider<tspan fill="#0284c7">Blocks</tspan></text>
  <text x="48" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#757575" letter-spacing="0.5">DESIGN SYSTEM</text>
</svg>
